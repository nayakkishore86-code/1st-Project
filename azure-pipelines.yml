trigger:
- none

pool:
  name: Nayak-pool

steps:

- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'

- powershell: |
    Get-Command terraform
    terraform version

    Write-Host "PWD:"
    Get-Location

    Write-Host "Files:"
    Get-ChildItem
  displayName: "Verify Terraform"