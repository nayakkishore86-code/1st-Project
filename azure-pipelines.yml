trigger:
- main

pool:
  name: August-pool

variables:
  workingDir: '$(Build.SourcesDirectory)/envirnment/dev'
  serviceConnection: 'kkservice'

stages:

#==================================
# Stage 1: Terraform Init
#==================================
- stage: Terraform_Init
  displayName: "1. Terraform Init"
  jobs:
  - job: Init
    displayName: "Initialize Terraform Backend"
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDir)'
        backendServiceArm: '$(serviceConnection)'
        backendAzureRmResourceGroupName: 'KK-rg'
        backendAzureRmStorageAccountName: 'kkstorage12345'
        backendAzureRmContainerName: 'kkcontainer'
        backendAzureRmKey: 'kk.tfstate'

#==================================
# Stage 2: Terraform Validate
#==================================
- stage: Terraform_Validate
  displayName: "2. Terraform Validate"
  dependsOn: Terraform_Init
  jobs:
  - job: Validate
    displayName: "Validate Terraform Configuration"
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDir)'
        backendServiceArm: '$(serviceConnection)'
        backendAzureRmResourceGroupName: 'KK-rg'
        backendAzureRmStorageAccountName: 'kkstorage12345'
        backendAzureRmContainerName: 'kkcontainer'
        backendAzureRmKey: 'kk.tfstate'

    - task: TerraformTask@5
      displayName: "Terraform Validate"
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(workingDir)'

#==================================
# Stage 3: Terraform Plan
#==================================
- stage: Terraform_Plan
  displayName: "3. Terraform Plan"
  dependsOn: Terraform_Validate
  jobs:
  - job: Plan
    displayName: "Generate Terraform Execution Plan"
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDir)'
        backendServiceArm: '$(serviceConnection)'
        backendAzureRmResourceGroupName: 'KK-rg'
        backendAzureRmStorageAccountName: 'kkstorage12345'
        backendAzureRmContainerName: 'kkcontainer'
        backendAzureRmKey: 'kk.tfstate'

    - task: TerraformTask@5
      displayName: "Terraform Plan"
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDir)'
        environmentServiceNameAzureRM: '$(serviceConnection)'
        commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

    - publish: $(Build.ArtifactStagingDirectory)/tfplan
      artifact: tfplan
      displayName: "Publish Terraform Plan Artifact"

#==================================
# Stage 4: Manual Approval & Apply
#==================================
- stage: Terraform_Apply
  displayName: "4. Manual Approval & Apply"
  dependsOn: Terraform_Plan
  jobs:
  # Manual Approval Gate (Server Job)
  - job: ManualApproval
    displayName: "Manual Approval Gate"
    pool: server
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 1440 # 24 hours
      inputs:
        notifyUsers: ''
        instructions: 'Please review the generated terraform plan before approving execution.'

  # Terraform Apply Deployment Job
  - deployment: Apply
    displayName: "Terraform Apply"
    dependsOn: ManualApproval
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: 'latest'

          - download: current
            artifact: tfplan
            displayName: "Download Terraform Plan Artifact"

          - task: TerraformTask@5
            displayName: "Terraform Init"
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDir)'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmResourceGroupName: 'KK-rg'
              backendAzureRmStorageAccountName: 'kkstorage12345'
              backendAzureRmContainerName: 'kkcontainer'
              backendAzureRmKey: 'kk.tfstate'

          - task: TerraformTask@5
            displayName: "Terraform Apply"
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDir)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '$(Pipeline.Workspace)/tfplan/tfplan'